<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://trendradar-connect.onrender.com; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>ربط Instagram · رادار الترند</title>
  <style>
    :root{color-scheme:dark}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1020;color:#fff;min-height:100vh;margin:0;display:grid;place-items:center}
    main{width:min(620px,calc(100% - 32px))}
    .box{border:1px solid #2d395c;border-radius:18px;padding:28px;background:#10182b}
    h1{margin-top:0}
    button{width:100%;padding:14px 18px;border:0;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer}
    p{line-height:1.8;color:#d7deee}
    .status{margin-top:14px;min-height:1.6em;color:#ffd479}
    small{color:#9cabca}
  </style>
</head>
<body>
<main>
  <div class="box">
    <h1>ربط Instagram مع رادار الترند</h1>
    <p>سيتم التفويض مباشرة عبر Instagram للحساب الاحترافي المملوك لرادار الترند. النشر العام يظل معطّلًا حتى اعتماد منفصل.</p>
    <button id="connect" type="button">متابعة إلى Instagram</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <p><small>لا يتم عرض أو تخزين كلمة المرور في هذا الموقع.</small></p>
  </div>
</main>
<script>
(() => {
  const button = document.getElementById('connect');
  const status = document.getElementById('status');
  button.addEventListener('click', async () => {
    button.disabled = true;
    status.textContent = 'جارٍ تجهيز التفويض الآمن…';
    try {
      const response = await fetch('https://trendradar-connect.onrender.com/oauth/start', {
        method: 'GET',
        mode: 'cors',
        credentials: 'omit',
        cache: 'no-store'
      });
      const data = await response.json();
      if (!response.ok || !data.ok || !String(data.authorization_url || '').startsWith('https://www.instagram.com/oauth/authorize?')) {
        throw new Error(data.error || 'OAUTH_START_FAILED');
      }
      location.assign(data.authorization_url);
    } catch (error) {
      status.textContent = 'تعذر بدء الربط الآن. حاول مرة أخرى بعد قليل.';
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
