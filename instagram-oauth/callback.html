<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://trendradar-instagram-oauth.onrender.com; img-src data:; base-uri 'none'; form-action 'none'">
<title>نتيجة ربط Instagram — رادار الترند</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#0b1020;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center}
main{width:min(92vw,640px);background:#121a31;border:1px solid #2a3558;border-radius:18px;padding:28px;box-sizing:border-box}
h1{margin-top:0}.box{padding:14px;border-radius:12px;background:#0d1428;line-height:1.8}.ok{border:1px solid #3c8}.bad{border:1px solid #c66}a{color:#fff}
</style>
</head>
<body>
<main>
<h1>نتيجة ربط Instagram</h1>
<div id="result" class="box">جارٍ التحقق من التفويض...</div>
</main>
<script>
const backend = "https://trendradar-instagram-oauth.onrender.com";
const result = document.getElementById("result");
(async () => {
  const params = new URLSearchParams(location.search);
  const payload = {
    code: params.get("code") || "",
    state: params.get("state") || "",
    error: params.get("error") || "",
    error_description: params.get("error_description") || ""
  };
  history.replaceState({}, "", "/instagram-oauth/callback.html");
  try {
    const response = await fetch(backend + "/api/public-oauth/callback", {
      method: "POST",
      mode: "cors",
      cache: "no-store",
      headers: {"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify(payload)
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || data.stage || "OAUTH_CALLBACK_FAILED");
    const username = data.username ? "@" + data.username : "الحساب المعتمد";
    const accountType = data.account_type || "Professional";
    result.className = "box ok";
    result.innerHTML = "<strong>تم الربط والتحقق بنجاح.</strong><br>الحساب: " + username + "<br>النوع: " + accountType + "<br>النشر العام ما زال معطّلًا.";
  } catch (error) {
    result.className = "box bad";
    result.textContent = "لم يكتمل التحقق. لم يتم نشر أي محتوى. الرمز: " + String(error.message || error);
  }
})();
</script>
</body>
</html>
