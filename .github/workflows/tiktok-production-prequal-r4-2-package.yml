name: TikTok R4.2 Focused Retest Package

on:
  push:
    branches:
      - tiktok-production-prequal-r4-2-remediation-20260929
    paths:
      - .github/workflows/tiktok-production-prequal-r4-2-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-r4-2-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact frozen R4.2 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ece8039623ee82176d756591af9495414a80d3d6
          path: candidate_repo
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout R4.2 handoff instructions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: e164ca616a771100f803297ee91090d1ddd8cd86
          path: handoff_repo
          fetch-depth: 1
          persist-credentials: false

      - name: Build exact-target-bound R4.2 package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="TrendRadar-TikTok-Production-Prequalification-R4.2-Retest-20260929-ece80396"
          mkdir -p "$PACKAGE/exact_target" "$PACKAGE/candidate" "$PACKAGE/producer_evidence"

          cd candidate_repo
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          test "$ACTUAL_COMMIT" = "ece8039623ee82176d756591af9495414a80d3d6"
          test "$ACTUAL_TREE" = "f4fbd1ab5273c0e66decca5b68674e2a1d2ed532"

          git bundle create "../$PACKAGE/exact_target/TikTok-R4.2-Exact-Target-ece80396.bundle" HEAD
          git archive --format=tar --output="../$PACKAGE/exact_target/full-repository-snapshot.tar" HEAD
          git archive --format=tar HEAD | tar -x -C "../$PACKAGE/candidate"
          git ls-tree -r --full-tree HEAD > "../$PACKAGE/exact_target/FULL_TREE_LS.txt"

          python tools/generate_tiktok_sbom.py             --commit "$ACTUAL_COMMIT"             --output "../$PACKAGE/exact_target/TIKTOK_SBOM_R4_2.cdx.json"

          {
            echo "EXACT_COMMIT=$ACTUAL_COMMIT"
            echo "EXACT_TREE=$ACTUAL_TREE"
            git show --no-patch --format='COMMIT=%H%nTREE=%T%nPARENTS=%P%nAUTHOR_DATE=%aI%nCOMMITTER_DATE=%cI%nSUBJECT=%s' HEAD
          } > "../$PACKAGE/exact_target/GIT_SHOW_COMMIT_TREE.txt"
          cd ..

          cp handoff_repo/review/tiktok/TIKTOK_INDEPENDENT_RETEST_REQUEST_R4_2_20260929.md "$PACKAGE/INDEPENDENT_REVIEW_README.md"
          cp handoff_repo/review/tiktok/TIKTOK_REVIEWER_ACTIONS_R4_2_AR_20260929.md "$PACKAGE/REVIEWER_ACTIONS_AR.md"
          cp handoff_repo/review/tiktok/TIKTOK_R4_1_INDEPENDENT_FINDING_RECORD_20260929.md "$PACKAGE/R4_1_INDEPENDENT_FINDING_RECORD.md"

          cat > "$PACKAGE/EXACT_TARGET.txt" <<'EOF'
          PROJECT=TrendHunter / Trend Radar
          SCOPE=TikTok only
          REPOSITORY=trendradarar-dotcom/trendradarar
          FROZEN_REVIEW_BRANCH=tiktok-production-prequal-r4-2-retest-candidate-20260929
          EXACT_COMMIT=ece8039623ee82176d756591af9495414a80d3d6
          EXACT_TREE=f4fbd1ab5273c0e66decca5b68674e2a1d2ed532
          PREVIOUS_R4_1_FAILED_COMMIT=168642cf54a25edf0949f2e61ede457a3ec19f18
          BASE_ACCEPTED_R3_COMMIT=47be83f732e63ffc04362f19820c9818e3d574a9
          TIKTOK_AUDIT_APPROVED=false/unset
          PUBLIC_AUTO_PUBLISH=NOT_AUTHORIZED
          CANDIDATE_DEPLOYED=false
          EOF

          cat > "$PACKAGE/START_HERE.md" <<'EOF'
          # START HERE — TikTok R4.2 Focused Independent Retest

          1. Verify MANIFEST_SHA256.txt.
          2. Verify Git bundle, exact commit and exact tree.
          3. Rebuild root tree from full-repository-snapshot.tar.
          4. Stop Fail-Closed on any mismatch.
          5. Read INDEPENDENT_REVIEW_README.md.
          6. Retest R4-02 strict counter validation and R4-03 documentation only.
          7. Run focused regression only for potentially affected controls.
          8. Treat producer CI/tests as orientation, not closure evidence.
          9. Do not deploy, merge, change Render, create paid infrastructure, Recall/Resubmit, or enable public posting.
          10. Final production auto-publish remains NOT AUTHORIZED even if R4.2 passes.
          EOF

          cat > "$PACKAGE/producer_evidence/PRODUCER_EVIDENCE.md" <<'EOF'
          # Producer evidence — NOT independent closure evidence

          Previous independent R4.1:
          - Exact Target = PASS
          - R4-02 = FAIL due fractional counter coercion
          - R4-03 = FAIL because docs overstated count validation
          - Focused R3/R4 Regression = PASS
          - R3 remains PASS and F-01..F-05 remain closed

          R4.2 producer remediation:
          - _nonnegative_int accepts only type(value) is int and value >= 0
          - rejects fractions/floats, numeric strings, booleans and negatives
          - documentation updated to state exact strict-integer behavior
          - production gates remain NOT VERIFIED

          Producer-observed CI:
          - run: 36503552984
          - result: SUCCESS
          - tests: 66/66 PASS

          This is producer evidence only.
          EOF

          BUNDLE_ABS="$PWD/$PACKAGE/exact_target/TikTok-R4.2-Exact-Target-ece80396.bundle"
          SNAPSHOT_ABS="$PWD/$PACKAGE/exact_target/full-repository-snapshot.tar"
          rm -rf producer_r42_bundle_verify producer_r42_bundle_clone producer_r42_snapshot
          git init -q producer_r42_bundle_verify
          git -C producer_r42_bundle_verify bundle verify "$BUNDLE_ABS"             > "$PACKAGE/producer_evidence/EXACT_TARGET_REPRODUCIBILITY_CHECK.txt" 2>&1
          git clone -q "$BUNDLE_ABS" producer_r42_bundle_clone
          {
            echo "BUNDLE_HEAD=$(git -C producer_r42_bundle_clone rev-parse HEAD)"
            echo "BUNDLE_TREE=$(git -C producer_r42_bundle_clone rev-parse 'HEAD^{tree}')"
          } >> "$PACKAGE/producer_evidence/EXACT_TARGET_REPRODUCIBILITY_CHECK.txt"

          mkdir -p producer_r42_snapshot
          tar -xf "$SNAPSHOT_ABS" -C producer_r42_snapshot
          git -C producer_r42_snapshot init -q
          git -C producer_r42_snapshot config core.autocrlf false
          git -C producer_r42_snapshot add -A
          SNAPSHOT_TREE="$(git -C producer_r42_snapshot write-tree)"
          echo "SNAPSHOT_TREE=$SNAPSHOT_TREE" >> "$PACKAGE/producer_evidence/EXACT_TARGET_REPRODUCIBILITY_CHECK.txt"

          test "$(git -C producer_r42_bundle_clone rev-parse HEAD)" = "ece8039623ee82176d756591af9495414a80d3d6"
          test "$(git -C producer_r42_bundle_clone rev-parse 'HEAD^{tree}')" = "f4fbd1ab5273c0e66decca5b68674e2a1d2ed532"
          test "$SNAPSHOT_TREE" = "f4fbd1ab5273c0e66decca5b68674e2a1d2ed532"

          (
            cd "$PACKAGE"
            find . -type f ! -name MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > MANIFEST_SHA256.txt
          )

          zip -qr "$PACKAGE.zip" "$PACKAGE"
          sha256sum "$PACKAGE.zip" > "$PACKAGE.zip.sha256"

      - name: Upload R4.2 focused retest package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TrendRadar-TikTok-Production-Prequalification-R4.2-Retest-20260929-ece80396
          path: |
            TrendRadar-TikTok-Production-Prequalification-R4.2-Retest-20260929-ece80396.zip
            TrendRadar-TikTok-Production-Prequalification-R4.2-Retest-20260929-ece80396.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
