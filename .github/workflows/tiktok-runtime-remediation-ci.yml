name: TikTok Runtime Remediation CI

on:
  push:
    branches:
      - tiktok-runtime-reliability-remediation-20260928
      - tiktok-production-admission-prep-20260929
      - tiktok-production-prequal-r4-remediation-20260929
      - tiktok-production-prequal-r4-2-remediation-20260929
      - tiktok-r5-postgres-backend-remediation-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r1-durable-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tiktok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tiktok_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked TikTok remediation dependencies
        run: python -m pip install --require-hashes -r tiktok_oauth_service/requirements.lock
      - name: Compile exact remediation code
        run: |
          python -m py_compile tiktok_oauth_service/app.py
          python -m py_compile tiktok_oauth_service/durable_state.py
          python -m py_compile tiktok_oauth_service/postgres_state.py
          python -m py_compile tiktok_oauth_service/test_durable_state.py
          python -m py_compile tiktok_oauth_service/test_app_safety.py
          python -m py_compile tiktok_oauth_service/test_recovery.py
          python -m py_compile tiktok_oauth_service/test_reconciliation.py
          python -m py_compile tiktok_oauth_service/test_media_validation.py
          python -m py_compile tiktok_oauth_service/test_atomicity.py
          python -m py_compile tiktok_oauth_service/test_recovery_qualification.py
          python -m py_compile tiktok_oauth_service/test_ops_watchdog.py
          python -m py_compile tiktok_oauth_service/test_backend_selection.py
          python -m py_compile tiktok_oauth_service/test_postgres_state.py
          python -m py_compile tools/tiktok_recovery_qualification.py
          python -m py_compile tools/tiktok_ops_watchdog.py
          python -m py_compile tools/generate_tiktok_sbom.py
      - name: Durable state and safety-gate unit tests
        working-directory: tiktok_oauth_service
        run: python -m unittest -v test_durable_state.py test_app_safety.py test_recovery.py test_reconciliation.py test_media_validation.py test_atomicity.py test_recovery_qualification.py test_ops_watchdog.py test_backend_selection.py
      - name: PostgreSQL DurableState integration and concurrency tests
        working-directory: tiktok_oauth_service
        env:
          TIKTOK_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/tiktok_test
        run: python -m unittest -v test_postgres_state.py
      - name: Generate exact-commit SBOM and verify immutable supply-chain refs
        run: |
          python tools/generate_tiktok_sbom.py --commit "$GITHUB_SHA" --output /tmp/tiktok-sbom.cdx.json
          python - <<'PY'
          import json, os
          data=json.load(open("/tmp/tiktok-sbom.cdx.json",encoding="utf-8"))
          assert data["metadata"]["component"]["version"] == os.environ["GITHUB_SHA"].lower()
          assert data["components"]
          assert any(c.get("name")=="av" for c in data["components"])
          assert any(c.get("name")=="psycopg" for c in data["components"])
          assert any(c.get("name")=="psycopg-binary" for c in data["components"])
          assert all(
              c.get("hashes") or c.get("purl","").startswith("pkg:github/")
              for c in data["components"]
          )
          PY
      - name: No mutable GitHub Action tags remain
        run: |
          ! grep -R -nE 'uses:[[:space:]]+[^[:space:]#]+@v[0-9]+' .github/workflows
      - name: No legacy process-memory OAuth stores
        run: |
          ! grep -q '_STATES' tiktok_oauth_service/app.py
          ! grep -q '_SESSIONS' tiktok_oauth_service/app.py
          ! grep -q '_HANDOFFS' tiktok_oauth_service/app.py
      - name: Preserve public-posting lock
        run: |
          grep -q 'TIKTOK_AUDIT_APPROVED' tiktok_oauth_service/app.py
