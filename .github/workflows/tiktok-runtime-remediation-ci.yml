name: TikTok Runtime Remediation CI

on:
  push:
    branches:
      - tiktok-runtime-reliability-remediation-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r1-durable-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned TikTok remediation dependency
        run: python -m pip install -r tiktok_oauth_service/requirements.txt
      - name: Compile exact remediation code
        run: |
          python -m py_compile tiktok_oauth_service/app.py
          python -m py_compile tiktok_oauth_service/durable_state.py
          python -m py_compile tiktok_oauth_service/test_durable_state.py
          python -m py_compile tiktok_oauth_service/test_app_safety.py
          python -m py_compile tiktok_oauth_service/test_recovery.py
          python -m py_compile tiktok_oauth_service/test_reconciliation.py
          python -m py_compile tiktok_oauth_service/test_media_validation.py
          python -m py_compile tiktok_oauth_service/test_atomicity.py
      - name: Durable state and safety-gate unit tests
        working-directory: tiktok_oauth_service
        run: python -m unittest -v test_durable_state.py test_app_safety.py test_recovery.py test_reconciliation.py test_media_validation.py test_atomicity.py
      - name: No legacy process-memory OAuth stores
        run: |
          ! grep -q '_STATES' tiktok_oauth_service/app.py
          ! grep -q '_SESSIONS' tiktok_oauth_service/app.py
          ! grep -q '_HANDOFFS' tiktok_oauth_service/app.py
      - name: Preserve public-posting lock
        run: |
          grep -q 'TIKTOK_AUDIT_APPROVED' tiktok_oauth_service/app.py
