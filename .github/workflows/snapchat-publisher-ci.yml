name: Snapchat Publisher CI

on:
  push:
    branches:
      - snapchat-production-review-20260925
      - snapchat-production-remediation-20260928
    paths:
      - "snapchat_publisher_service/**"
      - "snapchat_oauth_service/**"
      - ".github/workflows/snapchat-publisher-ci.yml"
      - ".github/scripts/snapchat_secret_scan.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: snapchat
          POSTGRES_PASSWORD: snapchat_ci_only
          POSTGRES_DB: snapchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snapchat -d snapchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved/pinned
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 resolved/pinned
        with:
          python-version: "3.14"

      - name: Install Snapchat runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r snapchat_publisher_service/requirements.txt
          python -m pip install -r snapchat_oauth_service/requirements.txt
          python -m pip check

      - name: Vulnerability audit Snapchat dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r snapchat_publisher_service/requirements.txt
          pip-audit -r snapchat_oauth_service/requirements.txt

      - name: Compile Snapchat services
        run: |
          python -m compileall -q snapchat_publisher_service
          python -m compileall -q snapchat_oauth_service

      - name: Static security scan
        run: |
          python -m pip install bandit==1.9.4
          bandit -q -r snapchat_publisher_service snapchat_oauth_service -x "*/test_*.py"

      - name: Run exact Snapchat publisher tests
        working-directory: snapchat_publisher_service
        run: python -m unittest discover -v -p "test_*.py"

      - name: Run direct-bridge security and recovery tests
        working-directory: snapchat_oauth_service
        run: python -m unittest discover -v -p "test_*.py"

      - name: Run PostgreSQL durable-state integration tests
        working-directory: snapchat_oauth_service
        env:
          SNAPCHAT_TEST_POSTGRES_URL: postgresql://snapchat:snapchat_ci_only@127.0.0.1:5432/snapchat_test
        run: python -m unittest -v test_postgres_integration.py

      - name: Verify no credential material in current Snapchat tree
        run: python .github/scripts/snapchat_secret_scan.py current-tree

      - name: Verify no credential material in Snapchat git history
        run: python .github/scripts/snapchat_secret_scan.py history
