name: Snapchat Publisher CI

on:
  push:
    branches:
      - snapchat-production-review-20260925
      - snapchat-production-remediation-20260928
    paths:
      - "snapchat_publisher_service/**"
      - "snapchat_oauth_service/**"
      - ".github/workflows/snapchat-publisher-ci.yml"
      - ".github/scripts/snapchat_secret_scan.py"
      - "SNAPCHAT_*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: snapchat
          POSTGRES_PASSWORD: snapchat_ci_only
          POSTGRES_DB: snapchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snapchat -d snapchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved/pinned
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 resolved/pinned
        with:
          python-version: "3.14"

      - name: Verify committed dependency locks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pairs = [
              ("snapchat_publisher_service/requirements.in", "snapchat_publisher_service/requirements.txt"),
              ("snapchat_oauth_service/requirements.in", "snapchat_oauth_service/requirements.txt"),
          ]
          for input_path, lock_path in pairs:
              direct = [
                  line.strip()
                  for line in Path(input_path).read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]
              lock = Path(lock_path).read_text(encoding="utf-8")
              if "--require-hashes" not in lock:
                  raise SystemExit(f"{lock_path}: missing --require-hashes")
              for requirement in direct:
                  if requirement.lower() not in lock.lower():
                      raise SystemExit(f"{lock_path}: direct pin missing: {requirement}")
              stanzas = []
              current = []
              for line in lock.splitlines():
                  if not line.strip() or line.lstrip().startswith("#") or line.strip() == "--require-hashes":
                      continue
                  if not line.startswith((" ", "\t")) and "==" in line:
                      if current:
                          stanzas.append(current)
                      current = [line]
                  elif current:
                      current.append(line)
              if current:
                  stanzas.append(current)
              if not stanzas:
                  raise SystemExit(f"{lock_path}: no locked requirements")
              for stanza in stanzas:
                  if not any("--hash=sha256:" in line for line in stanza):
                      raise SystemExit(f"{lock_path}: unhashed requirement: {stanza[0]}")
              print(f"{lock_path}: hash-lock structure verified ({len(stanzas)} packages)")
          PY

      - name: Install Snapchat runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r snapchat_publisher_service/requirements.txt
          python -m pip install --require-hashes -r snapchat_oauth_service/requirements.txt
          python -m pip check

      - name: Vulnerability audit Snapchat dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r snapchat_publisher_service/requirements.txt
          pip-audit -r snapchat_oauth_service/requirements.txt

      - name: Compile Snapchat services
        run: |
          python -m compileall -q snapchat_publisher_service
          python -m compileall -q snapchat_oauth_service

      - name: Static security scan
        run: |
          python -m pip install bandit==1.9.4
          bandit -q -r snapchat_publisher_service snapchat_oauth_service -x "*/test_*.py"

      - name: Run exact Snapchat publisher tests
        working-directory: snapchat_publisher_service
        run: python -m unittest discover -v -p "test_*.py"

      - name: Run direct-bridge security and recovery tests
        working-directory: snapchat_oauth_service
        run: python -m unittest discover -v -p "test_*.py"

      - name: Run PostgreSQL durable-state integration tests
        working-directory: snapchat_oauth_service
        env:
          SNAPCHAT_TEST_POSTGRES_URL: postgresql://snapchat:snapchat_ci_only@127.0.0.1:5432/snapchat_test
        run: python -m unittest -v test_postgres_integration.py

      - name: Record PostgreSQL test image digest
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(docker images --no-trunc --quiet postgres:16.15-bookworm | head -n1)"
          test -n "$image_id"
          echo "PostgreSQL test image ID: $image_id"

      - name: Test PostgreSQL backup restore and duplicate prevention
        working-directory: snapchat_oauth_service
        shell: bash
        env:
          SOURCE_DB: postgresql://snapchat:snapchat_ci_only@127.0.0.1:5432/snapchat_test
          RESTORE_DB: postgresql://snapchat:snapchat_ci_only@127.0.0.1:5432/snapchat_restore
        run: |
          set -euo pipefail
          python backup_restore_probe.py seed "$SOURCE_DB"
          container_id="$(docker ps --filter ancestor=postgres:16.15-bookworm --format '{{.ID}}' | head -n1)"
          test -n "$container_id"
          docker exec "$container_id" pg_dump -U snapchat -d snapchat_test -Fc -f /tmp/snapchat.dump
          docker exec "$container_id" psql -U snapchat -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS snapchat_restore;"
          docker exec "$container_id" psql -U snapchat -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE snapchat_restore;"
          docker exec "$container_id" pg_restore -U snapchat -d snapchat_restore --exit-on-error /tmp/snapchat.dump
          python backup_restore_probe.py verify "$RESTORE_DB"

      - name: Verify no credential material in current Snapchat tree
        run: python .github/scripts/snapchat_secret_scan.py current-tree

      - name: Verify no credential material in Snapchat git history
        run: python .github/scripts/snapchat_secret_scan.py history
