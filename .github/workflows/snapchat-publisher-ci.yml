name: Snapchat Publisher CI

on:
  push:
    branches:
      - snapchat-production-review-20260925
    paths:
      - "snapchat_publisher_service/**"
      - "snapchat_oauth_service/**"
      - ".github/workflows/snapchat-publisher-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Snapchat runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r snapchat_publisher_service/requirements.txt
          python -m pip install -r snapchat_oauth_service/requirements.txt
          python -m pip check

      - name: Vulnerability audit Snapchat dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r snapchat_publisher_service/requirements.txt
          pip-audit -r snapchat_oauth_service/requirements.txt

      - name: Compile Snapchat services
        run: |
          python -m compileall -q snapchat_publisher_service
          python -m compileall -q snapchat_oauth_service

      - name: Run exact Snapchat publisher tests
        working-directory: snapchat_publisher_service
        run: python -m unittest discover -v -p "test_*.py"

      - name: Run dormant direct-bridge fail-closed tests
        working-directory: snapchat_oauth_service
        run: python -m unittest discover -v -p "test_*.py"

      - name: Verify no obvious credential material is committed
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' snapchat_publisher_service snapchat_oauth_service
          ! grep -R -nE 'AKIA[0-9A-Z]{16}' snapchat_publisher_service snapchat_oauth_service
          echo "Basic committed-credential pattern scan passed."
