name: TikTok Independent Review Package

on:
  push:
    branches:
      - tiktok-runtime-reliability-remediation-20260928
    paths:
      - .github/workflows/tiktok-independent-review-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact frozen candidate with full Git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: acb5aff7a79de29f82c150428d29136148b51b36
          path: candidate_repo
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout review handoff instructions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 7a76ed1b5a3dd6a61caa83f88bd93fdfeb271795
          path: handoff_repo
          fetch-depth: 1
          persist-credentials: false

      - name: Build independently verifiable exact-target package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="TrendRadar-TikTok-Independent-Review-Package-20260928-ExactTarget-v2-acb5aff7"
          mkdir -p "$PACKAGE/exact_target"
          mkdir -p "$PACKAGE/candidate"
          mkdir -p "$PACKAGE/producer_evidence"

          cd candidate_repo
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          test "$ACTUAL_COMMIT" = "acb5aff7a79de29f82c150428d29136148b51b36"
          test "$ACTUAL_TREE" = "56694a061bbd5ca09f1d8db8e014e04200258403"

          git bundle create "../$PACKAGE/exact_target/TikTok-Exact-Target-acb5aff7.bundle" HEAD
          git bundle verify "../$PACKAGE/exact_target/TikTok-Exact-Target-acb5aff7.bundle"             > "../$PACKAGE/exact_target/BUNDLE_VERIFY_PRODUCER.txt" 2>&1

          {
            echo "EXACT_COMMIT=$ACTUAL_COMMIT"
            echo "EXACT_TREE=$ACTUAL_TREE"
            git show --no-patch --format='COMMIT=%H%nTREE=%T%nPARENTS=%P%nAUTHOR_DATE=%aI%nCOMMITTER_DATE=%cI%nSUBJECT=%s' HEAD
          } > "../$PACKAGE/exact_target/GIT_SHOW_COMMIT_TREE.txt"

          git ls-tree -r --full-tree HEAD > "../$PACKAGE/exact_target/FULL_TREE_LS.txt"
          git archive --format=tar --output="../$PACKAGE/exact_target/full-repository-snapshot.tar" HEAD
          git archive --format=tar HEAD | tar -x -C "../$PACKAGE/candidate"
          cd ..

          cp handoff_repo/review/tiktok/TIKTOK_INDEPENDENT_REVIEW_REQUEST_20260928.md "$PACKAGE/INDEPENDENT_REVIEW_README.md"
          cp handoff_repo/review/tiktok/TIKTOK_REVIEWER_ACTIONS_AR_20260928.md "$PACKAGE/REVIEWER_ACTIONS_AR.md"
          cp handoff_repo/review/tiktok/EXACT_TARGET_REOPEN_INSTRUCTIONS_20260928.md "$PACKAGE/EXACT_TARGET_REOPEN_INSTRUCTIONS.md"

          cat > "$PACKAGE/EXACT_TARGET.txt" <<'EOF'
          PROJECT=TrendHunter / Trend Radar
          SCOPE=TikTok only
          REPOSITORY=trendradarar-dotcom/trendradarar
          FROZEN_REVIEW_BRANCH=tiktok-independent-review-candidate-20260928
          EXACT_COMMIT=acb5aff7a79de29f82c150428d29136148b51b36
          EXACT_TREE=56694a061bbd5ca09f1d8db8e014e04200258403
          LIVE_PRE_REMEDIATION_BRANCH=tiktok-oauth-service
          LIVE_PRE_REMEDIATION_COMMIT=a421e755c31bf8e00a2cffc047db2c7d9e70bcbe
          TIKTOK_AUDIT_APPROVED=false/unset
          PUBLIC_AUTO_PUBLISH=NOT_AUTHORIZED
          CANDIDATE_DEPLOYED=false
          EOF

          cat > "$PACKAGE/START_HERE.md" <<'EOF'
          # START HERE — Independent Reviewer

          This is replacement package v2 created only to cure the prior Evidence/Target Binding failure.

          1. Read EXACT_TARGET_REOPEN_INSTRUCTIONS.md FIRST.
          2. Independently run git bundle verify on exact_target/TikTok-Exact-Target-acb5aff7.bundle.
          3. Clone that bundle and independently verify:
             - HEAD = acb5aff7a79de29f82c150428d29136148b51b36
             - HEAD^{tree} = 56694a061bbd5ca09f1d8db8e014e04200258403
          4. If either mismatch occurs, STOP FAIL-CLOSED.
          5. Only after Exact Target PASS, read INDEPENDENT_REVIEW_README.md in full.
          6. Treat all producer evidence as untrusted until independently reproduced.
          7. candidate/ is now the FULL tracked repository snapshot from the exact commit, not a TikTok-only subset.
          8. Do not Deploy, Merge, alter Render, Recall/resubmit TikTok App Review, enable public posting, or set TIKTOK_AUDIT_APPROVED=true.
          9. Use only PASS / FAIL / NOT VERIFIED / N/A per item with reproducible evidence.
          EOF

          cat > "$PACKAGE/producer_evidence/PRODUCER_EVIDENCE.md" <<'EOF'
          # Producer evidence — informational only

          This is NOT independent evidence and must not be accepted without reproduction.

          Producer-observed anchors:
          - exact commit: acb5aff7a79de29f82c150428d29136148b51b36
          - exact tree: 56694a061bbd5ca09f1d8db8e014e04200258403
          - previous candidate CI run: 36362387452
          - previous candidate CI result: SUCCESS
          - live Render branch during remediation: tiktok-oauth-service
          - live Render commit during remediation: a421e755c31bf8e00a2cffc047db2c7d9e70bcbe
          - hardened candidate deployed: NO
          - TikTok App Review recalled/resubmitted by this remediation: NO
          - public auto-publish authorized: NO
          EOF

          (
            cd "$PACKAGE"
            find . -type f ! -name MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > MANIFEST_SHA256.txt
          )

          zip -qr "$PACKAGE.zip" "$PACKAGE"
          sha256sum "$PACKAGE.zip" > "$PACKAGE.zip.sha256"

      - name: Upload exact-target independent review package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TrendRadar-TikTok-Independent-Review-Package-20260928-ExactTarget-v2-acb5aff7
          path: |
            TrendRadar-TikTok-Independent-Review-Package-20260928-ExactTarget-v2-acb5aff7.zip
            TrendRadar-TikTok-Independent-Review-Package-20260928-ExactTarget-v2-acb5aff7.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
