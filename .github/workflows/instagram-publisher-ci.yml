name: Instagram Publisher Admission

on:
  push:
    branches:
      - instagram-production-remediation-20260928
      - instagram-production-remediation-r2-20260928
      - instagram-production-remediation-r3-20260928
      - instagram-production-remediation-r4-20260928
      - instagram-production-remediation-r5-20260928
    paths:
      - "instagram_oauth_service/**"
      - "instagram_oauth_gateway/**"
      - "tests/test_instagram_publisher.py"
      - "tests/test_instagram_gateway.py"
      - "tests/test_instagram_postgres_integration.py"
      - "tests/test_instagram_postgres_runtime.py"
      - "tests/test_instagram_media_full_decode.py"
      - ".github/workflows/instagram-publisher-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trendradar_instagram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trendradar_instagram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INSTAGRAM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trendradar_instagram_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.3"
          cache: pip
          cache-dependency-path: instagram_oauth_service/requirements.txt
      - name: Install exact runtime
        run: |
          python -m pip install -r instagram_oauth_service/requirements.txt
          python -m pip install -r instagram_oauth_gateway/requirements.txt
          python -m pip install pip-audit==2.10.1
          python -m pip check
      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r instagram_oauth_service/requirements.txt
          python -m pip_audit -r instagram_oauth_gateway/requirements.txt
      - name: Build immutable runtime wheel evidence
        run: |
          mkdir -p dependency-wheelhouse
          python -m pip download --only-binary=:all:             -r instagram_oauth_service/requirements.txt             -d dependency-wheelhouse
          python -m pip download --only-binary=:all:             -r instagram_oauth_gateway/requirements.txt             -d dependency-wheelhouse
          (cd dependency-wheelhouse && sha256sum * | sort > SHA256SUMS.txt)
      - name: Upload exact runtime wheelhouse
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instagram-runtime-wheelhouse-${{ github.sha }}
          path: dependency-wheelhouse/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Compile exact Instagram sources
        run: |
          python -m py_compile instagram_oauth_service/app.py
          python -m py_compile instagram_oauth_service/publisher_runtime.py
          python -m py_compile instagram_oauth_service/refresh_cron.py
          python -m py_compile instagram_oauth_service/trendhunter_instagram_publisher.py
          python -m py_compile instagram_oauth_gateway/app.py
      - name: Run adversarial Instagram tests
        run: |
          python -m unittest -v tests.test_instagram_publisher
          python -m unittest -v tests.test_instagram_gateway
          python -m unittest -v tests.test_instagram_media_full_decode
          python -m unittest -v tests.test_instagram_postgres_integration
          python -m unittest -v tests.test_instagram_postgres_runtime
      - name: Record resolved dependency set
        run: python -m pip freeze --all
