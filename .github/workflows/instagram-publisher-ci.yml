name: Instagram Publisher Admission

on:
  push:
    branches:
      - instagram-production-remediation-20260928
    paths:
      - "instagram_oauth_service/**"
      - "tests/test_instagram_publisher.py"
      - ".github/workflows/instagram-publisher-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
          cache: pip
          cache-dependency-path: instagram_oauth_service/requirements.txt
      - name: Install exact runtime
        run: python -m pip install -r instagram_oauth_service/requirements.txt
      - name: Compile exact Instagram sources
        run: |
          python -m py_compile instagram_oauth_service/app.py
          python -m py_compile instagram_oauth_service/publisher_runtime.py
          python -m py_compile instagram_oauth_service/refresh_cron.py
          python -m py_compile instagram_oauth_service/trendhunter_instagram_publisher.py
      - name: Run adversarial publisher tests
        run: python -m unittest -v tests.test_instagram_publisher
