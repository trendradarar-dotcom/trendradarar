name: Instagram M26.7 R5 Media Retest Evidence

on:
  push:
    branches:
      - instagram-m26-7-r5-media-evidence-20260928
    paths:
      - ".github/workflows/instagram-m26-7-r5-media-retest-evidence.yml"

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    env:
      R4_TARGET: 7055c33042b4e46b150315067c08dbda728974e7
      EXACT_TARGET: d41c1c1cdaa7cf374989e2b059db6a640cb51eef
      EXACT_TREE: 9b7d7c2ab974a55cc9073e24386f4cbe9de8437d
      REVIEW_REQUEST: 60fd6ad71e43d47c5c9882b7deddffe2a77fa78b
      CI_RUN: "36422824796"
      WHEELHOUSE_NAME: instagram-runtime-wheelhouse-d41c1c1cdaa7cf374989e2b059db6a640cb51eef
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build exact Git and R4-to-R5 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-evidence

          test "$(git rev-parse "$EXACT_TARGET^{tree}")" = "$EXACT_TREE"
          test "$(git rev-parse "$REVIEW_REQUEST^")" = "$EXACT_TARGET"

          git cat-file -p "$R4_TARGET" > review-evidence/r4-target-commit.raw.txt
          git cat-file -p "$EXACT_TARGET" > review-evidence/r5-exact-target-commit.raw.txt
          git cat-file -p "$REVIEW_REQUEST" > review-evidence/r5-review-request-commit.raw.txt

          git rev-parse "$R4_TARGET^{tree}" > review-evidence/r4-tree-root.txt
          git rev-parse "$EXACT_TARGET^{tree}" > review-evidence/r5-exact-tree-root.txt
          git rev-parse "$REVIEW_REQUEST^{tree}" > review-evidence/r5-review-tree-root.txt

          git ls-tree -r -t "$EXACT_TARGET" > review-evidence/r5-exact-ls-tree.txt
          git diff --name-status "$R4_TARGET" "$EXACT_TARGET" > review-evidence/r4-to-r5.name-status.txt
          git diff --stat "$R4_TARGET" "$EXACT_TARGET" > review-evidence/r4-to-r5.stat.txt
          git diff --binary "$R4_TARGET" "$EXACT_TARGET" > review-evidence/r4-to-r5.patch

          git diff --name-status "$EXACT_TARGET" "$REVIEW_REQUEST" > review-evidence/r5-target-to-review.name-status.txt
          git diff --binary "$EXACT_TARGET" "$REVIEW_REQUEST" > review-evidence/r5-target-to-review.patch

          git diff --quiet "$EXACT_TARGET" "$REVIEW_REQUEST" --             .             ":(exclude)review/instagram/M26_7_R5_MEDIA_PREFLIGHT_INDEPENDENT_RETEST_20260928.md"
          printf 'PASS: R5 review-request delta is documentation-only.\n'             > review-evidence/documentation-only-delta-proof.txt

          git archive --format=zip --output=review-evidence/r5-exact-target-source.zip "$EXACT_TARGET"

          git branch -f evidence-r4-target "$R4_TARGET"
          git branch -f evidence-r5-exact-target "$EXACT_TARGET"
          git branch -f evidence-r5-review-request "$REVIEW_REQUEST"
          git bundle create review-evidence/instagram-m26-7-r5-media-retest.bundle             refs/heads/evidence-r4-target             refs/heads/evidence-r5-exact-target             refs/heads/evidence-r5-review-request
          git bundle verify review-evidence/instagram-m26-7-r5-media-retest.bundle             > review-evidence/git-bundle-verify.txt 2>&1

          git show "$EXACT_TARGET:instagram_oauth_service/app.py"             > review-evidence/r5-exact-app.py
          git show "$EXACT_TARGET:tests/test_instagram_media_full_decode.py"             > review-evidence/r5-exact-media-full-decode-tests.py
          git show "$EXACT_TARGET:.github/workflows/instagram-publisher-ci.yml"             > review-evidence/r5-exact-instagram-publisher-ci.yml
          git show "$EXACT_TARGET:instagram_oauth_service/requirements.txt"             > review-evidence/r5-exact-backend-requirements.txt
          git show "$REVIEW_REQUEST:review/instagram/M26_7_R5_MEDIA_PREFLIGHT_INDEPENDENT_RETEST_20260928.md"             > review-evidence/INDEPENDENT_RETEST_REQUEST.md

          {
            echo "R4_TARGET=$R4_TARGET"
            echo "EXACT_TARGET=$EXACT_TARGET"
            echo "EXACT_TREE=$EXACT_TREE"
            echo "REVIEW_REQUEST=$REVIEW_REQUEST"
            echo "CI_RUN=$CI_RUN"
            echo "GENERATED_FROM_EVIDENCE_COMMIT=$GITHUB_SHA"
          } > review-evidence/EVIDENCE_IDENTITY.txt

      - name: Capture exact CI and wheelhouse
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN"             > review-evidence/r5-exact-ci-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?per_page=100"             > review-evidence/r5-exact-ci-jobs.json
          gh run view "$CI_RUN" --repo "$GITHUB_REPOSITORY" --log             > review-evidence/r5-exact-ci.log

          gh run download "$CI_RUN" --repo "$GITHUB_REPOSITORY"             -n "$WHEELHOUSE_NAME" -D review-evidence/runtime-wheelhouse

          python - <<'PY'
          import json, os, pathlib
          run = json.loads(pathlib.Path("review-evidence/r5-exact-ci-run.json").read_text())
          assert run["head_sha"] == os.environ["EXACT_TARGET"]
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          pathlib.Path("review-evidence/ci-binding-proof.txt").write_text(
              f"PASS: CI run {run['id']} completed SUCCESS on head_sha={run['head_sha']}\n"
          )
          PY

      - name: Add offline verification script
        shell: bash
        run: |
          set -euo pipefail
          cat > review-evidence/VERIFY_OFFLINE.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          R4="7055c33042b4e46b150315067c08dbda728974e7"
          TARGET="d41c1c1cdaa7cf374989e2b059db6a640cb51eef"
          TREE="9b7d7c2ab974a55cc9073e24386f4cbe9de8437d"
          REVIEW="60fd6ad71e43d47c5c9882b7deddffe2a77fa78b"

          rm -rf verify-repo
          git clone instagram-m26-7-r5-media-retest.bundle verify-repo
          cd verify-repo
          git fsck --full --strict
          test "$(git cat-file -t "$TARGET")" = commit
          test "$(git rev-parse "$TARGET^{tree}")" = "$TREE"
          test "$(git rev-parse "$REVIEW^")" = "$TARGET"
          test "$(git diff --name-only "$TARGET" "$REVIEW")" =             "review/instagram/M26_7_R5_MEDIA_PREFLIGHT_INDEPENDENT_RETEST_20260928.md"

          expected=$'.github/workflows/instagram-publisher-ci.yml\ninstagram_oauth_service/app.py\ntests/test_instagram_media_full_decode.py'
          test "$(git diff --name-only "$R4" "$TARGET")" = "$expected"

          printf 'PASS: R5 target/tree, direct review child, narrow R4-to-R5 scope, and documentation-only review delta verified.\n'
          SH
          chmod +x review-evidence/VERIFY_OFFLINE.sh

      - name: Hash all evidence
        shell: bash
        run: |
          set -euo pipefail
          cd review-evidence
          find . -type f ! -name SHA256SUMS.txt -print0             | sort -z             | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload verifiable R5 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TrendRadar-Instagram-M26.7-R5-Media-Retest-Evidence
          path: review-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
