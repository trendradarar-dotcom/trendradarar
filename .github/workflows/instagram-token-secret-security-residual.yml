name: Instagram Token Secret Security Residual Drill

on:
  push:
    branches:
      - instagram-token-secret-security-residual-20260930
    paths:
      - "ops/instagram/token_secret_residual_drill.py"
      - ".github/workflows/instagram-token-secret-security-residual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-rotation-revocation-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_PASSWORD: synthetic-old-rotation-drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ROTATION_DB_HOST: 127.0.0.1
      ROTATION_DB_PORT: "5432"
      ROTATION_DB_NAME: postgres
      ROTATION_DB_USER: postgres
      ROTATION_DB_OLD_PASSWORD: synthetic-old-rotation-drill
      ROTATION_DB_NEW_PASSWORD: synthetic-new-rotation-drill

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Instagram application bytes unchanged from governed R5
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e d41c1c1cdaa7cf374989e2b059db6a640cb51eef^{commit}
          git diff --exit-code d41c1c1cdaa7cf374989e2b059db6a640cb51eef --             instagram_oauth_service/app.py             instagram_oauth_service/publisher_runtime.py             instagram_oauth_service/refresh_cron.py             instagram_oauth_gateway/app.py
          git rev-parse d41c1c1cdaa7cf374989e2b059db6a640cb51eef^{tree}             > /tmp/r5-tree.txt
          test "$(cat /tmp/r5-tree.txt)" = "9b7d7c2ab974a55cc9073e24386f4cbe9de8437d"

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"

      - name: Install governed Instagram requirements
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r instagram_oauth_service/requirements.txt
          python -m pip check

      - name: Run isolated synthetic secret rotation drill
        shell: bash
        run: |
          set -euo pipefail
          python ops/instagram/token_secret_residual_drill.py

      - name: Verify evidence contains no secret values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("evidence/instagram-token-secret-security/token-secret-residual-drill.json")
          s = p.read_text(encoding="utf-8")
          forbidden = [
              "synthetic-old-rotation-drill",
              "synthetic-new-rotation-drill",
              "access_token\":\"synthetic-only",
          ]
          for value in forbidden:
              if value in s:
                  raise SystemExit("secret-like synthetic value leaked into evidence")
          print("EVIDENCE_SECRET_VALUE_DISCLOSURE=NO")
          PY

      - name: Record exact evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/instagram-token-secret-security
          {
            echo "PROJECT=TrendHunter / Trend Radar"
            echo "SCOPE=Instagram only"
            echo "HEAD_SHA=$GITHUB_SHA"
            echo "R5_EXACT_COMMIT=d41c1c1cdaa7cf374989e2b059db6a640cb51eef"
            echo "R5_EXACT_TREE=9b7d7c2ab974a55cc9073e24386f4cbe9de8437d"
            echo "PYTHON=$(python --version 2>&1)"
            echo "POSTGRES_IMAGE=postgres@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650"
            echo "PRODUCTION_SECRETS_USED=NO"
            echo "PRODUCTION_DATABASE_TOUCHED=NO"
            echo "RENDER_MUTATION=NO"
            echo "PROVIDER_MUTATION=NO"
            echo "PUBLICATION_MUTATION=NO"
          } > evidence/instagram-token-secret-security/manifest.txt
          cp ops/instagram/token_secret_residual_drill.py evidence/instagram-token-secret-security/token-secret-residual-drill.py
          (
            cd evidence/instagram-token-secret-security
            sha256sum token-secret-residual-drill.py token-secret-residual-drill.json manifest.txt > SHA256SUMS.txt
          )

      - name: Upload residual evidence
        uses: actions/upload-artifact@v4
        with:
          name: instagram-token-secret-security-residual-evidence
          path: evidence/instagram-token-secret-security/
          if-no-files-found: error
          retention-days: 30
