[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-hunter-engine"
version = "0.4.6"
description = "Global Trend Opportunity Engine — governed, provenance-first pilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.20",
  "pydantic>=2.0",
  "Pillow>=12.3.0",
  "arabic-reshaper>=3.0.1",
  "python-bidi>=0.6.11",
  "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
trend-hunter = "trend_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
trend_hunter = ["schema.sql"]
